# Сборка и тесты.
#
# Заведено потому, что проверять всё вручную перед каждым слиянием никто
# не будет, а ошибка вида «забыли миграцию» или «опечатка в маршруте»
# обнаруживается иначе только на сервере без интернета, куда нужно ехать.

name: Сборка и тесты

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  dotnet:
    name: Сервер и панель управления
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Восстановление пакетов
        run: dotnet restore UpdateHub.slnx

      - name: Сборка
        run: dotnet build UpdateHub.slnx --configuration Release --no-restore

      # Способ запуска тестов задан в dotnet.config: xunit.v3 работает поверх
      # Microsoft.Testing.Platform, а `dotnet test` на .NET 10 без этой настройки
      # идёт прежним путём через VSTest и отказывается работать. Ключ
      # --verbosity здесь не указан намеренно: у нового запуска свой набор
      # ключей, и лишний привёл бы к отказу разобрать командную строку.
      - name: Тесты
        run: dotnet test UpdateHub.slnx --configuration Release --no-build

  client:
    name: Клиент на bash
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Разбор синтаксиса
        run: |
          bash -n UpdateHub.Client/updatehub
          bash -n UpdateHub.Client/install.sh
          for file in UpdateHub.Client/lib/*.sh UpdateHub.Client/tests/*.sh; do
            bash -n "$file"
          done

      # Ключ --source-path=SCRIPTDIR обязателен: программа собрана из модулей,
      # которые подключаются по пути относительно самого сценария. Без него
      # shellcheck ищет их относительно текущего каталога, не находит и считает
      # это замечанием — а замечание любого уровня для него означает отказ.
      - name: Статический разбор shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --external-sources --source-path=SCRIPTDIR --shell=bash \
            UpdateHub.Client/updatehub \
            UpdateHub.Client/install.sh \
            UpdateHub.Client/lib/*.sh \
            UpdateHub.Client/tests/run-tests.sh

      - name: Тесты клиента
        run: ./UpdateHub.Client/tests/run-tests.sh

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Образ собирается из корня репозитория: сервер ссылается на общую
      # библиотеку и на панель управления, и из каталога сервера они не видны.
      # Ошибка в контексте сборки обнаруживается только здесь.
      - name: Сборка образа
        run: docker build -t updatehub-server:ci .
