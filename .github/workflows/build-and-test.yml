# Сборка и тесты.
#
# Заведено потому, что проверять всё вручную перед каждым слиянием никто
# не будет, а ошибка вида «забыли миграцию» или «опечатка в маршруте»
# обнаруживается иначе только на сервере без интернета, куда нужно ехать.

name: Сборка и тесты

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  dotnet:
    name: Сервер и панель управления
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Восстановление пакетов
        run: dotnet restore UpdateHub.slnx

      # Ключ -warnaserror включён только здесь, а не в файлах проектов:
      # во время правки кода незаконченный фрагмент почти всегда даёт
      # предупреждения, и падающая сборка в студии мешала бы работать.
      # В master при этом ничего с новыми предупреждениями не попадёт.
      - name: Сборка
        run: dotnet build UpdateHub.slnx --configuration Release --no-restore -warnaserror

      # Тесты запускаются напрямую, а не через `dotnet test`.
      #
      # xunit.v3 работает поверх Microsoft.Testing.Platform, а `dotnet test`
      # на .NET 10 SDK всё равно идёт прежним путём через VSTest, который эта
      # платформа больше не поддерживает: запуск падает с «Testing with VSTest
      # target is no longer supported by Microsoft.Testing.Platform». Настройка
      # в dotnet.config эту развилку не снимает — проверено на SDK 10.0.400.
      #
      # Обходить её и не нужно: тестовый проект xunit.v3 — не библиотека,
      # а обычное консольное приложение со своим запуском внутри. Его
      # достаточно позвать, и код возврата уже означает исход прогона.
      # В Visual Studio ничего не меняется: она запускает тесты своим средством.
      - name: Тесты
        run: |
          dotnet UpdateHub.Backend.Tests/bin/Release/net10.0/UpdateHub.Backend.Tests.dll
          dotnet UpdateHub.Frontend.Tests/bin/Release/net10.0/UpdateHub.Frontend.Tests.dll

  client:
    name: Клиент на bash
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Разбор синтаксиса
        run: |
          bash -n UpdateHub.Client/updatehub
          bash -n UpdateHub.Client/install.sh
          for file in UpdateHub.Client/lib/*.sh UpdateHub.Client/tests/*.sh; do
            bash -n "$file"
          done

      # Ключ --source-path=SCRIPTDIR обязателен: программа собрана из модулей,
      # которые подключаются по пути относительно самого сценария. Без него
      # shellcheck ищет их относительно текущего каталога, не находит и считает
      # это замечанием — а замечание любого уровня для него означает отказ.
      - name: Статический разбор shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --external-sources --source-path=SCRIPTDIR --shell=bash \
            UpdateHub.Client/updatehub \
            UpdateHub.Client/install.sh \
            UpdateHub.Client/lib/*.sh \
            UpdateHub.Client/tests/run-tests.sh \
            UpdateHub.Client/tests/e2e.sh

      - name: Тесты клиента
        run: ./UpdateHub.Client/tests/run-tests.sh

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Образ собирается из корня репозитория: сервер ссылается на общую
      # библиотеку и на панель управления, и из каталога сервера они не видны.
      # Ошибка в контексте сборки обнаруживается только здесь.
      - name: Сборка образа
        run: docker build -t updatehub-server:ci .

  # Сквозная проверка: настоящий клиент против настоящего сервера в контейнерах.
  #
  # Заведена потому, что остальные проверки стык между ними не закрывают. Тесты
  # клиента работают против поддельного сервера на Python, написанного из того же
  # понимания протокола, из которого получился настоящий: ошибись это понимание —
  # обе стороны ошибутся одинаково, и все проверки пройдут. Тесты сервера
  # обращаются к нему через HttpClient, а не через curl.
  #
  # Задача носит осведомительный характер: continue-on-error не даёт ей помешать
  # слиянию в master. Она поднимает образ, устанавливает клиент в чистую Ubuntu
  # и потому зависит от сети и внешних образов — отказ по такой причине не должен
  # останавливать работу. Смотреть её итог стоит глазами.
  e2e:
    name: Сквозная проверка клиента и сервера
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Прогон
        run: ./UpdateHub.Client/tests/e2e.sh
